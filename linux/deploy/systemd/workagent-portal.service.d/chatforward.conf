[Unit]
# Production dependencies stay loopback-only. Missing storage, provider egress,
# local notifications, CLIProxy, or the ChatForward bridge prevents Portal
# activation. The browser is wanted (rather than required) so the one-time
# interactive ChatGPT login can be completed without making Portal unavailable.
Requires=mihomo.service cliproxyapi.service workagent-notification.service workagent-chatforward.service
Wants=workagent-chatforward-browser.service
After=mihomo.service cliproxyapi.service workagent-notification.service workagent-chatforward.service workagent-chatforward-browser.service srv-workagent-users.mount
RequiresMountsFor=/srv/workagent/users
AssertPathIsMountPoint=/srv/workagent/users
