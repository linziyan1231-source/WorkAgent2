[Unit]
Wants=workagent-portal.service
After=workagent-portal.service
ConditionFileIsExecutable=/usr/libexec/workagent-core-activation-admission-v1
ConditionPathExists=/run/workagent/activation.lock

[Service]
ExecStartPre=+/usr/libexec/workagent-core-activation-admission-v1
ExecStartPre=+/usr/libexec/workagent-edge-publication-admission-v1
ExecStartPost=+/usr/libexec/workagent-edge-publication-admission-v1 --watch $MAINPID
TimeoutStartSec=6min
TimeoutStartFailureMode=kill
KillMode=control-group
SendSIGKILL=yes
FinalKillSignal=SIGKILL
Restart=no
RuntimeDirectory=caddy-admin
RuntimeDirectoryMode=0700
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
