name: source-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Install checksum-pinned scanners
        shell: bash
        env:
          GO_BIN: go
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          installer=$RUNNER_TEMP/install-ci-tools-exact.sh
          git --no-replace-objects cat-file blob "$EXPECTED_SOURCE_REVISION:scripts/install-ci-tools.sh" > "$installer"
          chmod 0500 "$installer"
          "$installer" "$RUNNER_TEMP/workagent-tools"
      - name: Test, analyze, and scan exact source
        shell: bash
        env:
          GO_BIN: go
          GITLEAKS_BIN: ${{ runner.temp }}/workagent-tools/gitleaks
          GOVULNCHECK_BIN: ${{ runner.temp }}/workagent-tools/govulncheck
          SHELLCHECK_BIN: ${{ runner.temp }}/workagent-tools/shellcheck
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          SOURCE_GATE_MODE: quality
        run: |
          set -euo pipefail
          gate=$RUNNER_TEMP/source-gate-exact.sh
          git --no-replace-objects cat-file blob "$EXPECTED_SOURCE_REVISION:scripts/source-gate.sh" > "$gate"
          chmod 0500 "$gate"
          "$gate" "$RUNNER_TEMP/workagent-quality"

  # Keep this final job ID stable for branch protection. It runs on a fresh VM
  # after quality, receives no prior workspace/cache/artifact, and never runs
  # repository tests before producing the release evidence.
  verify:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact uncached Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Install checksum-pinned scanners
        shell: bash
        env:
          GO_BIN: go
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          installer=$RUNNER_TEMP/install-ci-tools-exact.sh
          git --no-replace-objects cat-file blob "$EXPECTED_SOURCE_REVISION:scripts/install-ci-tools.sh" > "$installer"
          chmod 0500 "$installer"
          "$installer" "$RUNNER_TEMP/workagent-tools"
      - name: Build, isolate, seal, and round-trip source-gate evidence
        shell: bash
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          QUALITY_GATE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 0077
          isolated_root=/opt/workagent-source-gate-build
          builder=workagent-source-gate
          test ! -e "$isolated_root"
          sudo useradd --system --user-group --no-create-home \
            --home-dir "$isolated_root/home" --shell /usr/sbin/nologin "$builder"
          sudo install -d -m 0700 -o "$builder" -g "$builder" \
            "$isolated_root" "$isolated_root/home" "$isolated_root/artifacts" \
            "$isolated_root/source"
          sudo cp -a --reflink=never -- "$RUNNER_TEMP/workagent-tools" "$isolated_root/tools"
          source_root=$isolated_root/source
          sudo cp -a --reflink=never -- "$GITHUB_WORKSPACE/." "$source_root/"
          gate_script=$isolated_root/source-gate-exact.sh
          git --no-replace-objects cat-file blob "$EXPECTED_SOURCE_REVISION:scripts/source-gate.sh" | sudo tee "$gate_script" >/dev/null
          sudo chmod 0500 "$gate_script"
          sudo chown -R "$builder:$builder" -- "$isolated_root/tools" "$source_root"
          sudo chown "$builder:$builder" "$gate_script"
          test "$(stat -c %d:%i -- "$GITHUB_WORKSPACE/.git/HEAD")" != \
            "$(sudo stat -c %d:%i -- "$source_root/.git/HEAD")"
          if ! workspace_writable=$(sudo -n -u "$builder" find "$GITHUB_WORKSPACE" -writable -print -quit); then
            echo "isolated build user could not prove the original checkout access boundary" >&2
            exit 1
          fi
          if [[ -n $workspace_writable ]]; then
            echo "isolated build user can write the original checkout" >&2
            exit 1
          fi

          sudo -n -u "$builder" env -i \
            HOME="$isolated_root/home" \
            PATH="$PATH" \
            GO_BIN="$(command -v go)" \
            GITLEAKS_BIN="$isolated_root/tools/gitleaks" \
            GOVULNCHECK_BIN="$isolated_root/tools/govulncheck" \
            SHELLCHECK_BIN="$isolated_root/tools/shellcheck" \
            EXPECTED_SOURCE_REVISION="$EXPECTED_SOURCE_REVISION" \
            QUALITY_GATE_SOURCE_REVISION="$QUALITY_GATE_SOURCE_REVISION" \
            SOURCE_GATE_MODE=artifact \
            /bin/bash -c 'set -e; cd -- "$1"; exec "$2" "$3"' \
            workagent-source-gate-run "$source_root" "$gate_script" "$isolated_root/artifacts"

          # No untrusted build UID process may survive into packaging. Copying
          # without reflinks then changes every payload inode and root ownership
          # closes the writer boundary before the first archive read.
          sudo pkill -KILL -u "$builder" 2>/dev/null || true
          if sudo pgrep -u "$builder" >/dev/null; then
            echo "isolated build user still has a live process" >&2
            exit 1
          fi
          sealed_parent=$(sudo mktemp -d /opt/workagent-source-gate-sealed.XXXXXX)
          sudo chmod 0700 "$sealed_parent"
          sudo mkdir -m 0700 "$sealed_parent/evidence"
          sudo cp -a --reflink=never -- "$isolated_root/artifacts/." "$sealed_parent/evidence/"
          sudo chown -R 0:0 -- "$sealed_parent"
          sealed=$sealed_parent/evidence
          test "$(sudo stat -c %d:%i "$isolated_root/artifacts/control-plane/bin/workagent-release")" != "$(sudo stat -c %d:%i "$sealed/control-plane/bin/workagent-release")"
          test "$(sudo stat -c %d:%i "$isolated_root/artifacts/migration-tools/bin/workagent-capture-windows")" != "$(sudo stat -c %d:%i "$sealed/migration-tools/bin/workagent-capture-windows")"
          test "$(sudo stat -c %d:%i "$isolated_root/artifacts/migration-tools/bin/workagent-migrate-windows")" != "$(sudo stat -c %d:%i "$sealed/migration-tools/bin/workagent-migrate-windows")"

          verify_content_inventory() {
            local root=$1 manifest=$2 actual
            actual=$(sudo mktemp "$sealed_parent/workagent-content-inventory.XXXXXX")
            sudo bash -o pipefail -c '
              set -eu
              export LC_ALL=C
              cd "$1"
              find . -type f ! -path ./SHA256SUMS -printf "%P\0" |
                sort -z | xargs -0 -r sha256sum --
            ' bash "$root" | sudo tee "$actual" >/dev/null
            sudo cmp -- "$manifest" "$actual"
            sudo rm -f -- "$actual"
          }
          verify_mode_manifest() {
            local profile=$1 root=$2 manifest=$3 actual root_mode
            actual=$(sudo mktemp "$sealed_parent/workagent-mode-inventory.XXXXXX")
            root_mode=$(sudo stat -c %a -- "$root")
            {
              printf '# workagent-release-tree-modes-v1 profile=%s\n' "$profile"
              printf 'd\t0%s\t.\n' "$root_mode"
              sudo find "$root" -mindepth 1 -printf '%y\t0%m\t%P\n'
            } | sort | sudo tee "$actual" >/dev/null
            sudo cmp -- "$manifest" "$actual"
            sudo rm -f -- "$actual"
          }
          verify_outer_evidence() {
            local root=$1 actual
            actual=$(sudo mktemp "$sealed_parent/workagent-outer-evidence.XXXXXX")
            sudo sh -c '
              set -eu
              export LC_ALL=C
              cd "$1"
              sha256sum \
                control-plane/SHA256SUMS \
                control-plane.tree-modes.tsv \
                migration-tools/SHA256SUMS \
                migration-tools.tree-modes.tsv \
                source-gate.json
            ' sh "$root" | sudo tee "$actual" >/dev/null
            sudo cmp -- "$root/EVIDENCE.sha256" "$actual"
            sudo sh -c 'cd "$1" && sha256sum --strict --check EVIDENCE.sha256 >/dev/null' sh "$root"
            sudo rm -f -- "$actual"
          }
          verify_source_gate_metadata() {
            local root=$1 expected
            expected=$(sudo mktemp "$sealed_parent/workagent-source-gate-metadata.XXXXXX")
            printf '%s\n' \
              '{' \
              '  "schema_version": 2,' \
              "  \"source_revision\": \"$EXPECTED_SOURCE_REVISION\"," \
              '  "target": "linux/amd64",' \
              '  "go_version": "1.26.5",' \
              '  "gitleaks_version": "8.28.0",' \
              '  "govulncheck_version": "1.6.0",' \
              '  "shellcheck_version": "0.11.0",' \
              '  "content_manifest_version": 1,' \
              '  "tree_mode_manifest_version": 1,' \
              '  "control_plane_mode_profile": "public",' \
              '  "migration_tools_mode_profile": "root-only"' \
              '}' | sudo tee "$expected" >/dev/null
            sudo cmp -- "$root/source-gate.json" "$expected"
            sudo rm -f -- "$expected"
          }
          verify_no_xattrs() {
            sudo python3 -c '
          import os, sys
          root = sys.argv[1]
          for directory, names, files in os.walk(root):
              for path in [directory, *(os.path.join(directory, name) for name in names + files)]:
                  if os.listxattr(path, follow_symlinks=False):
                      raise SystemExit("sealed evidence contains an extended attribute: " + path)
          ' "$1"
          }

          expected_top_level=$(printf '%s\n' \
            EVIDENCE.sha256 control-plane control-plane.tree-modes.tsv \
            migration-tools migration-tools.tree-modes.tsv \
            source-gate.json | sort)
          actual_top_level=$(sudo find "$sealed" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "$actual_top_level" = "$expected_top_level"
          test -z "$(sudo find "$sealed" -mindepth 1 \( -type l -o \( ! -type d ! -type f \) \) -print -quit)"
          test -z "$(sudo find "$sealed" -type f -links +1 -print -quit)"
          test -z "$(sudo find "$sealed" \( ! -user root -o ! -group root \) -print -quit)"
          verify_no_xattrs "$sealed"
          test -z "$(sudo find "$sealed/control-plane" -type d ! -perm 0555 -print -quit)"
          test -z "$(sudo find "$sealed/control-plane" -type f ! \( -perm 0444 -o -perm 0555 \) -print -quit)"
          test -z "$(sudo find "$sealed/migration-tools" -type d ! -perm 0500 -print -quit)"
          test -z "$(sudo find "$sealed/migration-tools" -type f ! \( -perm 0400 -o -perm 0500 \) -print -quit)"
          test "$(sudo stat -c %a "$sealed")" = 700
          test "$(sudo stat -c %a "$sealed/control-plane")" = 555
          test "$(sudo stat -c %a "$sealed/migration-tools")" = 500
          for path in source-gate.json EVIDENCE.sha256; do
            test "$(sudo stat -c %a "$sealed/$path")" = 600
          done
          for path in control-plane.tree-modes.tsv migration-tools.tree-modes.tsv; do
            test "$(sudo stat -c %a "$sealed/$path")" = 400
          done
          verify_source_gate_metadata "$sealed"
          verify_outer_evidence "$sealed"
          sudo sh -c 'cd "$1/control-plane" && sha256sum --strict --check SHA256SUMS >/dev/null' sh "$sealed"
          sudo sh -c 'cd "$1/migration-tools" && sha256sum --strict --check SHA256SUMS >/dev/null' sh "$sealed"
          verify_content_inventory "$sealed/control-plane" "$sealed/control-plane/SHA256SUMS"
          verify_content_inventory "$sealed/migration-tools" "$sealed/migration-tools/SHA256SUMS"
          verify_mode_manifest public "$sealed/control-plane" "$sealed/control-plane.tree-modes.tsv"
          verify_mode_manifest root-only "$sealed/migration-tools" "$sealed/migration-tools.tree-modes.tsv"

          upload_root=/opt/workagent-source-gate-upload
          test ! -e "$upload_root"
          sudo install -d -m 0700 -o root -g root "$upload_root"
          archive=$upload_root/workagent-source-gate.tar
          checksum=$upload_root/workagent-source-gate.tar.sha256
          sudo tar --create --file="$archive" \
            --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            --no-acls --no-xattrs \
            --directory="$sealed" \
            EVIDENCE.sha256 \
            control-plane control-plane.tree-modes.tsv \
            migration-tools migration-tools.tree-modes.tsv \
            source-gate.json
          extracted=$sealed_parent/extracted
          sudo mkdir -m 0700 "$extracted"
          sudo tar --extract --file="$archive" --same-owner --same-permissions \
            --delay-directory-restore --directory="$extracted"
          sudo diff --recursive --no-dereference -- "$sealed" "$extracted"
          roundtrip=$sealed_parent/roundtrip.tar
          sudo tar --create --file="$roundtrip" \
            --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=delete=atime,delete=ctime \
            --no-acls --no-xattrs \
            --directory="$extracted" \
            EVIDENCE.sha256 \
            control-plane control-plane.tree-modes.tsv \
            migration-tools migration-tools.tree-modes.tsv \
            source-gate.json
          sudo cmp -- "$archive" "$roundtrip"
          test -z "$(sudo find "$extracted" -mindepth 1 \( -type l -o \( ! -type d ! -type f \) \) -print -quit)"
          test -z "$(sudo find "$extracted" -type f -links +1 -print -quit)"
          test -z "$(sudo find "$extracted" \( ! -user root -o ! -group root \) -print -quit)"
          verify_no_xattrs "$extracted"
          verify_source_gate_metadata "$extracted"
          verify_outer_evidence "$extracted"
          sudo sh -c 'cd "$1/control-plane" && sha256sum --strict --check SHA256SUMS >/dev/null' sh "$extracted"
          sudo sh -c 'cd "$1/migration-tools" && sha256sum --strict --check SHA256SUMS >/dev/null' sh "$extracted"
          verify_content_inventory "$extracted/control-plane" "$extracted/control-plane/SHA256SUMS"
          verify_content_inventory "$extracted/migration-tools" "$extracted/migration-tools/SHA256SUMS"
          verify_mode_manifest public "$extracted/control-plane" "$extracted/control-plane.tree-modes.tsv"
          verify_mode_manifest root-only "$extracted/migration-tools" "$extracted/migration-tools.tree-modes.tsv"
          sudo sh -c 'cd "$1" && sha256sum workagent-source-gate.tar' sh "$upload_root" | sudo tee "$checksum" >/dev/null
          sudo chmod 0444 "$archive" "$checksum"
          sudo chown 0:0 "$archive" "$checksum"
          sudo chmod 0555 "$upload_root"

      - name: Preserve source-gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workagent-source-gate-${{ github.sha }}
          path: |
            /opt/workagent-source-gate-upload/workagent-source-gate.tar
            /opt/workagent-source-gate-upload/workagent-source-gate.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
